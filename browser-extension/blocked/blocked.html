<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Webseite blockiert</title>
    <link rel="stylesheet" href="blocked.css">
  </head>
  <body>
    <main class="card" aria-labelledby="blocked-title">
      <div class="shield" aria-hidden="true">
        <span>!</span>
      </div>
      <p class="product">Ubuntu Parental Control</p>
      <h1 id="blocked-title">Diese Webseite ist blockiert.</h1>
      <p class="explanation">
        Der Zugriff wurde durch eine verwaltete Webfilter-Regel verhindert.
      </p>
      <div id="block-source" class="block-source" hidden>
        <span>Ausgelöst durch</span>
        <strong id="block-source-name"></strong>
        <small id="block-source-priority"></small>
      </div>
      <div class="notice">
        <strong>Was kannst du tun?</strong>
        <p>
          Kehre zur vorherigen Seite zurück. Wenn du diese Webseite benötigst,
          wende dich an die Person, die dieses Gerät verwaltet.
        </p>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
