name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Browser tests (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check options-page syntax
        run: node --check browser-extension/options/options.js
      - name: Run JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.js; do
            node "$test_file"
          done

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q daemon installer tools tests
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  installer-and-build:
    name: Installer and extension packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run installer integration test
        run: bash tests/test-installer.sh
      - name: Build Firefox and Chrome packages
        run: python tools/build_extension.py
      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: browser-extension-packages
          path: |
            dist/ubuntu-parental-control-webfilter-firefox-unsigned.xpi
            dist/ubuntu-parental-control-webfilter-chrome.zip
          if-no-files-found: error
          retention-days: 14
